name: Debug build
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build and capture log
        run: |
          set +e
          bundle exec jekyll build > /tmp/build.log 2>&1
          echo "exit code: $?" >> /tmp/build.log
      - name: Report log to commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 /tmp/build.log > /tmp/build_trimmed.log
          python3 -c "import json; print(json.dumps({'body': open('/tmp/build_trimmed.log').read()}))" > /tmp/payload.json
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input /tmp/payload.json
