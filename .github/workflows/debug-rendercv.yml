name: Debug RenderCV
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: pip install -r requirements.txt
      - name: RenderCV
        run: |
          set +e
          cv_file=$(find _data -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          rendercv render "$cv_file" --settings "$settings" > /tmp/out.log 2>&1
          echo "exit code: $?" >> /tmp/out.log
      - name: Post log as commit comment
        if: always()
        run: |
          BODY=$(tail -c 60000 /tmp/out.log | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "{\"body\": $BODY}"
